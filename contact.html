<main class="contact">

    <h2>Contact Me</h2>

    <p>Have a question or want to get in touch?</p>

    <form class="contact-form" id="contactForm" action="https://webdevbasics.net/scripts/pacific.php" method="post" onsubmit="alert('Thank you for reaching out! Will read your message when I get the chance')">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message"
                  rows="10"
                  placeholder="Write your message here..."
                  required></textarea>

        <button type="submit">Send Message</button>

    </form>
    <p id="popupMessage"></p>

</main>
